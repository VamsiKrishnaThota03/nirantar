name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test
        working-directory: backend
        # No ANTHROPIC_API_KEY is set, so the agents run on their
        # deterministic cores and the model path is covered by a mocked
        # transport. CI never spends tokens.
        run: python -m pytest tests -q

      - name: Refuse to start without an identity provider
        working-directory: backend
        # The single most important safety property, asserted end to end
        # rather than only in a unit test.
        env:
          DEMO_MODE: "false"
        run: |
          if python -c "from nirantar.config import get_settings; get_settings()" 2>/dev/null; then
            echo "::error::Process started with DEMO_MODE=false and no OIDC provider configured."
            exit 1
          fi
          echo "Correctly refused to start."

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Boot on loopback and exercise the API
        working-directory: backend
        run: |
          HOST=127.0.0.1 PORT=8000 \
          DB_PATH=./var/ci.sqlite3 \
          LEDGER_KEY_PATH=./var/ci_key.pem \
          python -m uvicorn nirantar.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 1
          done

          echo "--- health ---"
          curl -sf http://127.0.0.1:8000/api/health

          echo "--- plan 100 obligations ---"
          curl -sf -X POST http://127.0.0.1:8000/api/simulate/batch \
            -H 'Content-Type: application/json' \
            -d '{"limit":100,"use_llm":false}'

          echo "--- the signed chain must verify ---"
          curl -sf http://127.0.0.1:8000/api/ledger/verify \
            | python -c "import json,sys; r=json.load(sys.stdin); assert r['valid'], r['problems']; print('chain valid,', r['entries'], 'entries')"

          echo "--- the controlled trial must run and stay out of the ledger ---"
          entries_before=$(curl -sf http://127.0.0.1:8000/api/ledger/summary | python -c "import json,sys; print(json.load(sys.stdin)['ledger_entries'])")
          curl -sf -X POST http://127.0.0.1:8000/api/trial \
            -H 'Content-Type: application/json' \
            -d '{"days":30,"trials":1}' \
            | python -c "import json,sys; r=json.load(sys.stdin); m=r['aggregate']['closure_multiple']['median']; assert m>1.0, f'optimiser did not beat the due-date queue: {m}'; print('closure multiple', m)"
          entries_after=$(curl -sf http://127.0.0.1:8000/api/ledger/summary | python -c "import json,sys; print(json.load(sys.stdin)['ledger_entries'])")
          if [ "$entries_before" != "$entries_after" ]; then
            echo "::error::The trial wrote to the Impact Ledger. Simulated outcomes must never enter the signed record."
            exit 1
          fi
          echo "trial did not touch the ledger ($entries_before entries before and after)"

          echo "--- the field queue must fit a 2G link ---"
          asha=$(curl -sf http://127.0.0.1:8000/api/asha | python -c "import json,sys; print(json.load(sys.stdin)[0]['id'])")
          curl -sf "http://127.0.0.1:8000/api/asha/$asha/tasks" \
            | python -c "import json,sys; t=json.load(sys.stdin)['transfer']; assert t['seconds_on_2g']<12, t; print('field queue', t['bytes'], 'bytes,', t['seconds_on_2g'], 's on 2G')"

          echo "--- operator routes must stay closed ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/operator/whoami)
          if [ "$code" = "200" ]; then
            echo "::error::Operator route returned 200 without authentication."
            exit 1
          fi
          echo "operator route correctly closed (HTTP $code)"
